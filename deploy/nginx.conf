# /etc/nginx/sites-available/eshi-blog
# Replace server_name and run certbot after this HTTP server is working.
# Certbot manages the certificate and TLS server block.

server {
    listen 80;
    listen [::]:80;
    server_name blog.example.com;

    client_max_body_size 3m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# After `certbot --nginx -d blog.example.com`, Certbot will add the TLS server
# block. If you choose the redirect option, it will also add an HTTP -> HTTPS
# redirect; verify the generated configuration before reloading Nginx.
# Make sure the production .env contains:
#   SITE_URL=https://blog.example.com
#   COOKIE_SECURE=true
#   TRUST_PROXY=1
#   HOST=127.0.0.1
