# /etc/nginx/sites-available/eshi-blog
# Replace blog.example.com and certificate paths before enabling.
# Run certbot after the HTTP server is working to obtain certificates.

server {
    listen 80;
    listen [::]:80;
    server_name blog.example.com;

    client_max_body_size 3m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# After `certbot --nginx -d blog.example.com`, Certbot will add the TLS server
# block and redirect. Make sure the production .env contains:
#   SITE_URL=https://blog.example.com
#   COOKIE_SECURE=true
#   TRUST_PROXY=1
