services:
  blog:
    build:
      context: .
      dockerfile: Dockerfile
    image: eshi-tech-notes:1.1.7
    container_name: eshi-blog
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DB_PATH: /app/data/blog.db
      UPLOAD_DIR: /app/uploads
      TRUST_PROXY: '1'
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./backups:/app/backups
    stop_grace_period: 10s
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
